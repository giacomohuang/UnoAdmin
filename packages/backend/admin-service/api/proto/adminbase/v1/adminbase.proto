syntax = "proto3";

// 包名与前端 core 的 admin-base 能力一一对应，供其它微服务调用。
package adminbase.v1;

option go_package = "github.com/unoadmin/admin-service/gen/adminbase/v1;adminbasev1";

// AdminBase 暴露基础管理能力：令牌校验、用户/角色/权限/租户查询与权限判定。
service AdminBase {
  // VerifyToken 校验用户令牌并返回主体信息，供其它微服务做鉴权。
  rpc VerifyToken(VerifyTokenRequest) returns (VerifyTokenResponse);
  // GetUser 按 ID 查询用户。
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // ListUsers 分页查询用户。
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // ListRoles 分页查询角色。
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  // ListPermissions 返回权限树。
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  // ListTenants 分页查询租户。
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  // HasPermission 判断某用户是否拥有指定权限码。
  rpc HasPermission(HasPermissionRequest) returns (HasPermissionResponse);
}

// User 与前端 core 的 User 接口字段保持一致。
message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string status = 5;
  repeated string role_names = 6;
}

// Role 与前端 core 的 Role 接口字段保持一致。
message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permission_codes = 4;
  int32 user_count = 5;
}

// Permission 支持 children 递归，构成权限树。
message Permission {
  string id = 1;
  string name = 2;
  string code = 3;
  string type = 4;
  repeated Permission children = 5;
}

// Tenant 与前端 core 的 Tenant 接口字段保持一致。
message Tenant {
  string id = 1;
  string name = 2;
  string code = 3;
  string status = 4;
}

// VerifyTokenRequest 携带待校验的原始 Bearer 令牌。
message VerifyTokenRequest {
  string token = 1;
}

// VerifyTokenResponse 返回校验结果与令牌中的主体信息。
message VerifyTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string tenant_id = 3;
  repeated string permissions = 4;
  string error = 5;
}

// GetUserRequest 按用户 ID 查询。
message GetUserRequest {
  string id = 1;
}

// GetUserResponse 返回单个用户。
message GetUserResponse {
  User user = 1;
}

// ListUsersRequest 使用与前端 ListQuery 相同的分页参数。
message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  string tenant_id = 4;
}

// ListUsersResponse 使用与前端 PageResult 相同的结构。
message ListUsersResponse {
  repeated User items = 1;
  int32 total = 2;
}

// ListRolesRequest 使用与前端 ListQuery 相同的分页参数。
message ListRolesRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

// ListRolesResponse 使用与前端 PageResult 相同的结构。
message ListRolesResponse {
  repeated Role items = 1;
  int32 total = 2;
}

// ListPermissionsRequest 目前无需参数，保留以便后续按租户过滤。
message ListPermissionsRequest {}

// ListPermissionsResponse 返回权限树根节点列表。
message ListPermissionsResponse {
  repeated Permission items = 1;
}

// ListTenantsRequest 使用与前端 ListQuery 相同的分页参数。
message ListTenantsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

// ListTenantsResponse 使用与前端 PageResult 相同的结构。
message ListTenantsResponse {
  repeated Tenant items = 1;
  int32 total = 2;
}

// HasPermissionRequest 让调用方按用户与权限码判定授权结果。
message HasPermissionRequest {
  string user_id = 1;
  string permission = 2;
}

// HasPermissionResponse 返回判定结果。
message HasPermissionResponse {
  bool allowed = 1;
}
